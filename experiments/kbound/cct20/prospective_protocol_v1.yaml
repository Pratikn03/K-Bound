schema: kbound-cct20-prospective-protocol-v1
protocol_id: KBOUND_CCT20_PROSPECTIVE_CONFIRMATION_v1
status: SEALED_BEFORE_SOURCE_TRAINING_AND_TARGET_OUTCOMES
sealed_utc: "2026-08-28T06:43:28Z"
amendment_rule: >-
  Any later change requires a new versioned protocol and disclosure. This file
  must remain byte-identical throughout all five source-training seeds, gate
  fitting, target execution, scoring, and primary inference.

