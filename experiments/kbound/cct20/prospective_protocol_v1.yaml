dataset:
  name: Caltech Camera Traps-20
  archive_population_images: 57864
  public_paper_population_images: 57868
  discrepancy_rule: use the five official archive split files and disclose the four-image difference
  output_classes: 16
  category_order: ascending_sparse_archive_category_id
  ground_truth: complete set of distinct category IDs for each image
  repeated_same_category: collapse
  conflicting_categories: retain complete set
  zero_annotation_or_unknown_category: fail_complete_experiment
  target_split: trans_test
  target_locations: [0, 7, 28, 40, 46, 78, 100, 105, 130]

roles:
  source_fit_and_monitor:
    split: train
    partition_unit: [location, seq_id]
    monitor_fraction: 0.10
    hash: sha256
    salt: KBOUND_CCT20_SOURCE_MONITOR_v1
  unused:
    - split: cis_val
      reason: supplied train/cis_val files contain overlapping sequence identifiers
  gate_fit:
    - {split: trans_val, location: 125}
    - {split: cis_test, location: 33}
  gate_cal:
    split: cis_test
    locations: [38, 43, 51, 61, 88, 90, 108, 115, 120]
  target:
    split: trans_test
    locations: [0, 7, 28, 40, 46, 78, 100, 105, 130]
  probe_evaluation_partition:
    unit: [location, seq_id]
    probe_fraction: 0.30
    hash: sha256
    salt: KBOUND_CCT20_PROBE_EVAL_v1
    hash_payload: UTF8(salt + NUL + str(location) + NUL + seq_id)
    hash_fraction: big_endian_integer_of_full_sha256_digest_divided_by_2^256
    rule: hash_fraction_strictly_below_0.30_is_probe_else_evaluation
    labels_used: false
    minimum_sequences_per_role_per_location: 1

source_model:
  implementation: torchvision.models.resnet50
  pretrained_weights: IMAGENET1K_V2
  replace_classifier_with_outputs: 16
  trainable_parameters: full_network
  seeds: [0, 1, 2, 3, 4]
  epochs: 10
  selection: highest source-monitor set-membership top1; earliest epoch breaks ties
  loss: normalized_soft_target_cross_entropy_over_distinct_ground_truth_set
  optimizer:
    name: SGD
    learning_rate: 0.01
    momentum: 0.9
    weight_decay: 0.0001
    nesterov: false
  scheduler:
    name: cosine_annealing
    t_max_epochs: 10
    eta_min: 0.000001
  batching:
    physical_batch_size: 32
    gradient_accumulation_steps: 4
    effective_batch_size: 128
    incomplete_final_accumulation: mean_over_actual_samples_in_accumulation_group
  train_transform:
    random_resized_crop: {size: 224, scale: [0.65, 1.0]}
    random_horizontal_flip_probability: 0.5
    color_jitter: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.1}
    normalization: IMAGENET1K_V2
  evaluation_transform:
    resize_shorter_side: 232
    center_crop: 224
    normalization: IMAGENET1K_V2
  checkpoint_requirements:
    count: 5
    distinct_tensor_sha256: required
    source_tensor_immutable_after_downstream_runs: required

adapter:
  name: official_tent
  repository: https://github.com/DequanWang/tent
  commit: e9e926a668d85244c66a6d5c006efbd2b82e83e8
  entry_points: [configure_model, collect_params, Tent]
  optimizer:
    name: Adam
    learning_rate: 0.001
    betas: [0.9, 0.999]
    weight_decay: 0.0
  steps: 1
  episodic: false
  reset_boundary: checkpoint_x_location
  stream_order: [date_captured, seq_id, frame_num, image_id]
  batching:
    target_images_per_batch: 128
    sequence_atomic: true
    cross_location_batch: forbidden
    singleton_final_batch: merge_into_previous
  prediction_semantics: official pre-update logits for each online batch

gate:
  action_unit: checkpoint_x_location
  evidence_role: probe_only
  outcome_role: evaluation_only
  features:
    - frozen_mean_entropy
    - tent_mean_entropy
    - entropy_change
    - frozen_mean_confidence
    - tent_mean_confidence
    - confidence_change
    - prediction_disagreement
    - marginal_jensen_shannon_divergence
    - normalized_predicted_class_effective_count
    - normalized_tent_update_norm
    - batchnorm_batch_source_statistic_divergence
  feature_formulas:
    probability_source: softmax_logits
    logarithm: natural
    aggregation: image_weighted_over_probe_only
    frozen_mean_entropy: mean_i(-sum_c p_frozen_ic * log(p_frozen_ic)) / log(16)
    tent_mean_entropy: mean_i(-sum_c p_tent_ic * log(p_tent_ic)) / log(16)
    entropy_change: frozen_mean_entropy - tent_mean_entropy
    frozen_mean_confidence: mean_i(max_c p_frozen_ic)
    tent_mean_confidence: mean_i(max_c p_tent_ic)
    confidence_change: tent_mean_confidence - frozen_mean_confidence
    prediction_disagreement: mean_i(1[argmax(p_frozen_i) != argmax(p_tent_i)])
    marginal_jensen_shannon_divergence: >-
      JSD(mean_i(p_frozen_i), mean_i(p_tent_i)) / log(2), using the equal-weight
      mixture and zero-times-log-zero equal to zero
    normalized_predicted_class_effective_count: >-
      exp(entropy(q_frozen)) / 16, where q_frozen is the empirical frequency of
      frozen probe argmax classes including zero-frequency classes
    normalized_tent_update_norm: >-
      L2(theta_BN_affine_after_probe - theta_BN_affine_before_probe) divided by
      max(L2(theta_BN_affine_before_probe), 1e-12), using exactly the parameters
      returned by official Tent collect_params
    batchnorm_batch_source_statistic_divergence: >-
      Channel-weighted mean Gaussian KL from probe moments to stored source BN
      moments across every BatchNorm channel: 0.5 * [log((var_source+eps)/(var_probe+eps))
      + (var_probe+eps+(mean_probe-mean_source)^2)/(var_source+eps) - 1]. Probe
      moments are population moments of the frozen model BN inputs over all probe
      images and spatial positions; eps is the layer's stored BN eps.
    numeric_clipping: probabilities_only_at_machine_tiny_before_log
  forbidden_features: [location_id, checkpoint_seed, target_label, class_composition, accuracy]
  benefit_estimator:
    standardize_on: gate_fit_only
    model: ridge
    alpha: 10.0
    hyperparameter_tuning: none
  calibration:
    alpha: 0.10
    unit: camera_location
    per_location_residual: maximum_absolute_residual_over_five_checkpoints
    exact_rank_k: 9
    exact_rank_n: 9
    radius: maximum_of_nine_gate_cal_location_residuals
    alpha_below_0.10: infinite_radius
  support:
    primary: finite_values_and_exact_feature_schema
    mahalanobis: diagnostic_only
  decision:
    adapt: support_pass_and_b_hat_minus_epsilon_strictly_positive
    freeze: support_pass_and_b_hat_plus_epsilon_strictly_negative
    abstain: otherwise
    abstain_realization: frozen

target_execution:
  firewall: target runner receives image metadata and pixels but no annotations or label lookup
  action_sealed_before_evaluation_labels: required
  execution_order:
    - process every probe sequence in native stream order
    - compute evidence and seal the checkpoint-by-location action
    - process every evaluation sequence in native stream order
  native_stream_order: [date_captured, seq_id, frame_num, image_id]
  globally_interleaved_probe_and_evaluation_stream: forbidden
  probe_predictions_scored: false
  evaluation_predictions_scored: true
  target_samples_must_have_exactly_one_role: required
  missing_decode_or_partial_location: fail_complete_experiment
  sample_substitution_or_denominator_reduction: forbidden
  rerun_with_changed_settings_after_outcome_opening: forbidden

inference:
  cell: checkpoint_x_location
  matrix_shape: [5, 9]
  primary_estimand: equal_weight_mean_over_checkpoints_and_locations
  primary_contrast: baseline_regret_minus_kga_regret
  positive_favors: KGA
  comparisons: [always_adapt, always_freeze]
  bootstrap:
    method: paired_two_way_product_bootstrap
    checkpoint_rows_and_location_columns_resampled_independently: true
    replicates: 20000
    random_seed: 20260828
    pointwise_ci_level: 0.95
    simultaneous_bonferroni_ci_level_per_comparison: 0.975
  small_cluster_test:
    method: exact_one_sided_sign_flip_over_nine_location_mean_differences
    multiplicity: Holm_over_two_primary_comparisons
    familywise_alpha: 0.05
  action_exposure:
    minimum_adapt_rate: 0.10
    minimum_freeze_rate: 0.10
    minimum_strict_decision_coverage: 0.30
  strong_success_requires:
    - both simultaneous Bonferroni intervals strictly above zero
    - both exact sign-flip p-values survive Holm at 0.05
    - all three action-exposure thresholds pass
    - all 45 checkpoint-by-location cells complete
  safe_utility:
    frozen_noninferiority_margin: -0.005
    requires_superiority_to_always_adapt: true
  report_regardless_of_result: true

claim_boundary:
  valid_if_completed: prospective outcome-unopened natural camera-location evaluation
  limitations:
    - aggregate target label metadata was inspected before execution and is disclosed
    - calibration cameras are mostly cis locations; formal trans-location conformal coverage is not claimed
    - set-valued scoring is not exact single-label leaderboard reproduction
    - five checkpoints and nine target locations yield low-resolution inference
