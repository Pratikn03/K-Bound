[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbound-kga"
version = "0.1.0"
description = "K-Bound / KGA: Knowability-Guided Adaptation — a finite-sample certificate for safe test-time adaptation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pratik Niroula" }]
keywords = ["test-time adaptation", "distribution shift", "certificate", "kga", "kbound"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Pratikn03/K-Bound"
Repository = "https://github.com/Pratikn03/K-Bound"
Issues = "https://github.com/Pratikn03/K-Bound/issues"

[project.scripts]
kga = "kga.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kga", "kga.*"]
exclude = ["tests*", "docs*", "experiments*", "src*"]
namespaces = false

[tool.setuptools.package-data]
kga = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
  "tests",
  "docs/research/kbound/tests",
  "docs/research/kbound/kbound_pkg/tests",
  "docs/research/kbound/edge/tests",
]
norecursedirs = [
  "archive",
  ".git",
  ".venv",
  "node_modules",
  ".lake",
]
addopts = "-q --strict-markers --import-mode=importlib"
pythonpath = [
  ".",
  "src",
  "docs/research/kbound/kbound_pkg",
  "docs/research/kbound/edge/src",
]

[tool.coverage.run]
branch = true
source = ["kga"]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.venv
  | venv
  | build
  | dist
  | \.ipynb_checkpoints
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip_gitignore = true
known_first_party = ["kga", "kbound", "kbound_edge"]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
    ".ipynb_checkpoints",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports
"tests/**/*.py" = ["B011"]  # assert false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    'venv',
    '.venv',
    'build',
    'dist',
]

[tool.bandit]
exclude_dirs = ["/tests", "/venv", "/.venv"]
skips = ["B101", "B601"]  # assert_used, paramiko_calls

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-module = true
fail-under = 60
exclude = ["setup.py", "docs", "build", "tests"]
verbose = 0
