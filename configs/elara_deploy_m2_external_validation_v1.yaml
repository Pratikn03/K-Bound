# M2 external (3D-ADAM sealed CSV) — validation-only WIN vs SAR dev harness

data:
  path: experiments/fusion/m2_external_3d_adam_sealed_inputs.csv
  format: csv
  id_column: sample_id
  domain_column: domain
  label_column: label
  score_column: score
  confidence_column: confidence
  category_column: category
  split_column: split
  embedding_prefix: embedding_
  feature_columns:
    - score
    - confidence
    - embedding_0
    - embedding_1
    - embedding_2
    - embedding_3
    - embedding_4
    - embedding_5
    - embedding_6
    - embedding_7
    - embedding_8
    - embedding_9
    - embedding_10
    - embedding_11
    - embedding_12
    - embedding_13
    - embedding_14
    - embedding_15
  domain_order: [rgb, depth_or_xyz]

model:
  num_domains: 2
  embed_dim: 48
  num_heads: 4
  num_layers: 1
  dropout: 0.1
  use_attention: true
  use_confidence: true
  use_input_confidence: true
  use_domain_embeddings: true
  use_positional_embeddings: true
  use_missing_embedding: true

training:
  seed: 42
  batch_size: 64
  epochs: 25
  lr: 0.001
  weight_decay: 0.01
  domain_dropout: 0.15
  split_column: split
  train_split_values: [train]
  val_split_values: [validation]
  test_split_values: [test]
  early_stopping: 6
  early_stopping_metric: pr_auc
  restore_best_weights: true

evaluation:
  seeds: [42, 43, 44]
  decision_threshold: val_f1
  tta_steps: 25

reliability:
  ece_weight: 0.45
  ks_weight: 0.35
  sharpness_weight: 0.20
  clean_gate_threshold: 0.66

calibration_transfer:
  enabled: true
  dataset_key: m2_external_3d_adam
  lock_path: elara_master_c/models/calibrators/calibrator_lock_v1.json

gate_decision_rule:
  enabled: true
  coherence_min: 0.5
  tau: 0.66
  margin_epsilon: 0.0

rga_plus:
  selection_metric: roc_pr_f1

elara_deploy:
  policy_path: research_lock/ELARA_DEPLOY_v2.yaml
  allow_test_eval: false
  sweep_tau_values: [0.55, 0.66, 0.75]
