# M2 external v2 — MulSen-AD RGB + infrared (one-shot audit)
# See research_lock/M2_EXTERNAL_SEALED_v2.yaml

data:
  path: experiments/fusion/m2_external_mulsen_sealed_inputs.csv
  format: csv
  id_column: sample_id
  domain_column: domain
  label_column: label
  score_column: score
  confidence_column: confidence
  category_column: category
  split_column: split
  embedding_prefix: embedding_
  feature_columns:
    - score
    - confidence
    - embedding_0
    - embedding_1
    - embedding_2
    - embedding_3
    - embedding_4
    - embedding_5
    - embedding_6
    - embedding_7
    - embedding_8
    - embedding_9
    - embedding_10
    - embedding_11
    - embedding_12
    - embedding_13
    - embedding_14
    - embedding_15
  domain_order: [rgb, infrared]

model:
  num_domains: 2
  embed_dim: 48
  num_heads: 4
  num_layers: 1
  dropout: 0.1
  use_attention: true
  use_confidence: true
  use_input_confidence: true
  use_domain_embeddings: true
  use_positional_embeddings: true
  use_missing_embedding: true

training:
  seed: 42
  batch_size: 64
  epochs: 25
  lr: 0.001
  weight_decay: 0.01
  domain_dropout: 0.15
  split_column: split
  train_split_values: [train]
  val_split_values: [validation]
  test_split_values: [test]
  early_stopping: 6
  early_stopping_metric: pr_auc
  restore_best_weights: true
  grad_clip_norm: 1.0
  lambda_reg: 0.01

output:
  model_dir: models/fusion/attention_m2_external_mulsen_sealed
  checkpoint_name: attention_m2_external_mulsen.pt
  metrics_path: experiments/fusion/m2_external_mulsen_sealed_attention_metrics.json

evaluation:
  metrics_path: experiments/fusion/m2_external_mulsen_sealed_harness_metrics.json
  seeds: [42, 43, 44, 45, 46]
  n_bootstrap: 200
  bootstrap_alpha: 0.05
  decision_threshold: val_f1

prediction_archive:
  enabled: true
  root: elara_master_c/predictions/confirmation
  experiment_id: M2-EXTERNAL-MULSEN
  benchmark: MulSen-AD category-held-out
  protocol: M2_external_v2_one_shot_audit
  analysis_family: M2_v2
  pairing_strength: independent_modalities

reliability:
  ece_weight: 0.45
  ks_weight: 0.35
  sharpness_weight: 0.20
  mean_gate_threshold: 0.66
