# Unified training-harness config: tabular Variational Autoencoder (Keras/TF).
# Requires tensorflow/keras at *run* time only (imported lazily by the adapter).
# Run with: python -m uais.training.cli --config configs/training/vae.yaml
name: vae
trainer: vae
seed: 42
data_path: data/processed/fraud/fraud_features.parquet
output_dir: experiments/training/vae
hyperparams:
  latent_dim: 16
  epochs: 20
  batch_size: 128
  test_size: 0.2
tracker: json
