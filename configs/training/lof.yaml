# Unified training-harness config: Local Outlier Factor anomaly detector.
# Run with: python -m uais.training.cli --config configs/training/lof.yaml
name: lof
trainer: lof
seed: 42
data_path: data/processed/fraud/fraud_features.parquet
output_dir: experiments/training/lof
hyperparams:
  # Supervised label column (synthesised as all-zero if absent in the data).
  target: label
  domain: fraud
  # Expected outlier proportion (matches train_lof default).
  contamination: 0.05
tracker: json
