# Phase 3 — Calibration-transfer closure protocol (pre-registered)
#
# Purpose:
# Close the held-out calibration-transfer gap using base RGA on naturally
# paired multimodal data under frozen, validation-only selection.

protocol:
  id: PHASE3_CAL_TRANSFER_001
  title: held_out_calibration_transfer_validation_base_rga
  status: preregistered_not_executed
  owner: ELARA

  primary_objective: >
    Validate whether a frozen, validation-calibrated base RGA policy
    preserves low clean false-fire and improves over static attention
    under pre-specified modality degradation on held-out naturally
    paired data.

  dataset:
    name: Eyecandies
    release: "1.0.3"
    pairing_type: naturally_co_observed_rgb_depth
    split_contract:
      train: anomaly_free
      validation: anomaly_free
      test: anomalous_held_out

  methods:
    primary: base_RGA
    comparator: static_attention
    optional_baseline: validation_frozen_non_rga
    frozen_policy_across_cells: true

  calibration_provenance:
    ks_reference_fit:
      allowed_source: validation_normal_only
      explicit_source_description: >
        KS reference may be re-fit only on anomaly-free validation rows.
      uses_test_scores: false
      uses_test_labels: false
      frozen_before_test_metric_read: true
    threshold_selection:
      rule: validation_only
      clean_false_fire_budget: 0.010
      uses_test_scores: false
      uses_test_labels: false
      frozen_before_test_metric_read: true

  clean_false_fire:
    required_max_rate: 0.010
    required_split: validation_clean
    failure_policy: protocol_invalid_if_exceeded

  stress_endpoints:
    primary:
      - id: D-EYE-1
        type: depth_score_collapse
      - id: D-EYE-2
        type: rgb_score_collapse
    secondary:
      - id: D-EYE-3
        type: single_modality_missingness

  inference:
    primary_metric: delta_auc_rga_minus_static
    seed_target: 30
    seed_minimum: 15
    delong_paired_test: true
    paired_bootstrap_iterations: 10000
    paired_bootstrap_seed: 0
    ci_alpha: 0.05
    multiplicity:
      family: D-EYE-PRIMARY
      k: 2
      correction: holm_bonferroni
    practical_delta_threshold: 0.010
    primary_success_rule: >
      Positive delta with CI excluding zero after multiplicity correction,
      while clean false-fire remains <= 0.010.

  execution:
    family_d_protocol_yaml: configs/phase2/family_d_v2_eyecandies_protocol.yaml
    family_d_pipeline_yaml: configs/phase2/family_d_v3_scoring_pipeline.yaml
    family_d_cell_runner: src/scripts/run_phase2_family_d_v2_cell.py
    family_d_inference_runner: src/scripts/run_phase2_family_d_v2_inference.py
    cell_ids_primary: [D-EYE-1, D-EYE-2]

  audit_outputs:
    manifest_json: docs/research/phase3/CALIBRATION_TRANSFER_CLOSURE_MANIFEST.json
    execution_log_md: docs/research/phase3/CALIBRATION_TRANSFER_EXECUTION_LOG.md
    result_summary_md: docs/research/phase3/CALIBRATION_TRANSFER_RESULT_SUMMARY.md

  forbidden:
    - test_outcome_guided_threshold_changes
    - post_test_operator_changes
    - per_cell_method_reselection
    - universal_or_sota_claims