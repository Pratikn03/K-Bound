# Phase 2.E — RGA-v2 partial-failure gate contract (locked before evaluation)
#
# Locks every selection rule, candidate gate, fault surface, and promotion
# criterion. The driver `src/scripts/run_phase2_rga_v2_partial_failure.py`
# must read this file and refuse to deviate.

contract:
  cell_id: B-MECH-2
  benchmark: ELARA-Bench-LA
  protocol: RGA-v2 partial-failure across k in {0,1,2,3,4}
  status: pending_compute

  candidate_gates:
    - id: G0
      name: existing mean gate (baseline)
      rule: "I(mean(reliability) < tau_mean)"
      tau_mean: 0.66           # LOCKED — no tuning of tau_mean
      validation_tuning_allowed: false
      role: baseline

    - id: G1
      name: validation-selected minimum gate
      rule: "I(min(reliability) < tau_min)"
      tau_min: validation-frozen
      tau_min_search_grid: [0.20, 0.25, 0.30, 0.34, 0.40, 0.45, 0.50, 0.55, 0.60, 0.66]
      validation_tuning_allowed: true
      validation_tuning_data: validation-fold corruption injections only (no test fold visibility)
      role: candidate

    - id: G2
      name: validation-selected hybrid gate
      rule: "I(mean(reliability) < tau_mean OR min(reliability) < tau_min)"
      tau_mean: 0.66           # LOCKED
      tau_min: validation-frozen
      tau_min_search_grid: [0.20, 0.25, 0.30, 0.34, 0.40, 0.45, 0.50, 0.55, 0.60, 0.66]
      validation_tuning_allowed: true
      role: candidate

    - id: G3
      name: top-q critical-domain gate
      rule: "I(reliability[sort()[q-1]] < tau_q)"
      q_search_grid: [1, 2]
      tau_q_search_grid: [0.30, 0.34, 0.40, 0.50, 0.60, 0.66]
      validation_tuning_allowed: true
      role: candidate

    - id: G4
      name: learned low-capacity gate (optional)
      rule: "I(logistic(<reliability_features>) > tau_g)"
      validation_tuning_allowed: true
      lock_architecture_before_evaluation: true
      role: optional_candidate

  fault_surface:
    k_values: [0, 1, 2, 3, 4]
    attacks: [zero_attack, max_attack, gaussian_noise]
    missing_domain_failure: enabled
    miscalibration_without_score_collapse: optional

  clean_false_fire_budget:
    # Locked BEFORE inspecting any evaluation outcome.
    # The default rule: max( 1.0% absolute activation, base_mean_gate_clean_activation + 0.5pp ).
    rule: "max(0.010, base_G0_clean_activation_rate + 0.005)"
    measurement_split: validation
    declared_at: contract-lock-time
    overrideable: false

  promotion_criteria_all_required:
    - id: C1
      description: within_false_fire_budget at G0 + 0.5pp or 1.0% absolute, whichever larger
    - id: C2
      description: improves at least 2 of {k=1, k=2, k=3} over G0 mean-gate under zero+max attack pair
    - id: C3
      description: does not worsen k=4 coherent-collapse by more than 0.005 ROC-AUC vs G0
    - id: C4
      description: produces positive switching certificate (LCB > 0) on at least one partial-failure regime
    - id: C5
      description: selection is validation-only (Phase 2.B contract; no test_fold visibility)
    - id: C6
      description: same gate policy across all cells; no per-test-cell retuning

  promotion_decisions:
    - PROMOTED_CANDIDATE     # all C1..C6 passed
    - MECHANISM_IMPROVEMENT_PARTIAL  # some partial-failure benefit, not all C1..C6 passed
    - NOT_IMPROVED           # does not improve the locked weakness
    - INVALID_SELECTION      # any test-driven tuning found

  seeds:
    target: 30
    minimum_for_inference: 15

  prediction_archive_required: true

  output_root: experiments/phase2/mechanism/rga_v2_prediction_archives
  report_root: docs/research/phase2/RGA_V2_PARTIAL_FAILURE_REPORT.md
