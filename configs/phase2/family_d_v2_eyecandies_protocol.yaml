# Phase 2.2C — Family-D v2 Eyecandies one-class degradation-stress protocol
#
# LOCKED. No placeholders. Any deviation invalidates the held-out invariant.
# Independent review required before execution.

protocol:
  name: validation_only_degradation_calibrated_one_class_multimodal
  dataset_name: Eyecandies
  dataset_release: "1.0.3"
  dataset_source: "https://github.com/eyecan-ai/eyecandies"

  # ---------- A. Dataset ----------
  dataset:
    primary_modalities: [rgb, depth]
    documented_but_excluded_from_primary: [normal]
    categories:
      - candycane
      - chocolatecookie
      - chocolatepraline
      - confetto
      - gummybear
      - hazelnuttruffle
      - licoricesandwich
      - lollipop
      - marshmallow
      - peppermintcandy

  # ---------- B. Train / validation / test rules ----------
  splits:
    train: official_train_anomaly_free
    validation: official_validation_anomaly_free
    test: official_test_anomalous_NOT_USED_BEFORE_EXECUTION
  invariants:
    test_evaluation_executed: false
    no_test_label_inspected_before_execution: true
    rgb_depth_pairing_required: true
    no_supervised_validation_label_used: true

  # ---------- C. Method ----------
  method:
    primary: base_RGA
    primary_basis: reliability_aware_gating_under_normal_only_calibration
    comparator: static_attention                # fixed; no per-cell selection
    rga_plus_supervised_head: DISABLED          # no labelled anomalous validation available
    test_selected_method_variant: FORBIDDEN

  # ---------- D. Clean false-fire budget ----------
  clean_false_fire_budget:
    value: 0.010                                # gate activation on clean validation <= 1.0%
    measurement_split: validation
    locked_at: phase_2_2C_freeze
    overrideable: false
    rationale: "Aligned with Phase-2 RGA-v2 false-fire budget convention (max(0.010, baseline+0.005))."

  # ---------- E. Reliability threshold selection ----------
  threshold_selection:
    rule: validation_only
    permitted_inputs:
      - normal_only_validation_data
      - pre_specified_validation_evidence_degradation_responses
      - clean_false_fire_budget
    forbidden_inputs:
      - official_anomalous_test_labels
      - test_fold_metrics
      - any_inspection_of_test_anomaly_masks

  # ---------- F. Locked evidence-degradation operators ----------
  degradation_operators:
    primary_endpoints:
      - id: D-EYE-1
        name: depth_channel_score_collapse
        target_modality: depth
        transformation_level: modality_score_level
        operator: "set per-domain depth score to 0.0 on the gated batch"
        parameters: { mode: "zero_collapse" }
        seed_policy: "validation injections deterministic; seed = global seed + 41000"
        validation_use: allowed
        future_test_use: allowed
        primary_or_secondary: primary
      - id: D-EYE-2
        name: rgb_channel_score_collapse
        target_modality: rgb
        transformation_level: modality_score_level
        operator: "set per-domain RGB score to 0.0 on the gated batch"
        parameters: { mode: "zero_collapse" }
        seed_policy: "validation injections deterministic; seed = global seed + 41001"
        validation_use: allowed
        future_test_use: allowed
        primary_or_secondary: primary
    secondary_descriptive:
      - id: D-EYE-3
        name: single_modality_missingness_secondary
        target_modality: depth_or_rgb_alternated
        transformation_level: mask_level
        operator: "set domain mask = True (missing) on validation injections"
        parameters: { mask_count: 1 }
        seed_policy: "deterministic; seed = global seed + 41002"
        validation_use: allowed
        future_test_use: descriptive_only
        primary_or_secondary: secondary
  rationale: |
    The current ELARA architecture supports clean modality-score-level
    degradation. Raw-sensor pixel-level corruption is not in scope for the
    first Family-D v2 freeze. The freeze therefore tests reliability-aware
    fusion under naturally paired modalities with pre-specified score-level
    evidence degradation; it does NOT establish raw-sensor corruption
    robustness.

  # ---------- G. Primary metric and inference ----------
  inference:
    primary_metric: roc_auc_delta_rga_minus_static_attention
    seed_count_target: 30
    seed_count_minimum_for_inference: 15
    raw_prediction_archive_required: true
    seed_ensemble_path:
      delong_paired_test: true
      paired_test_sample_bootstrap_iter: 10000
      paired_test_sample_bootstrap_seed: 0
      ci_alpha: 0.05
    multiplicity:
      family: D-EYE-PRIMARY
      family_size_K: 2          # D-EYE-1 + D-EYE-2; D-EYE-3 is secondary descriptive
      correction: holm_bonferroni

  # ---------- H. Minimum practically meaningful effect ----------
  practical_threshold:
    minimum_delta_for_positive_claim: 0.010
    interpretive_band_only: true
    not_a_deployment_threshold: true

  # ---------- Claim ceilings ----------
  claim_ceiling:
    allowed_positive: |
      "Held-out confirmatory evidence under the frozen Eyecandies RGB+depth
      one-class degradation-stress protocol for the evaluated endpoint(s)."
    allowed_negative: |
      "Held-out confirmation was not obtained for the evaluated endpoint(s);
      negative results are retained."
    forbidden:
      - ELARA is universal
      - ELARA is SOTA
      - ELARA is deployment-safe
      - Family A becomes confirmatory
      - RGA+ beats strongest baselines
      - Physical-AI safety validation
      - Raw-sensor corruption robustness (this protocol uses score-level degradation only)

  # ---------- Provenance ----------
  provenance:
    config_locked_at_phase: 2.2C
    must_be_signed_off_by: independent_review
    test_evaluation_executed: false
