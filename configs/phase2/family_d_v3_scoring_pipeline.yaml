# Family-D v3 — Eyecandies One-Class Scoring Pipeline Specification
#
# PURPOSE: This file closes the gap identified in
#   docs/research/phase2/FAMILY_D_V2_EXECUTION_BLOCKED_PROTOCOL_CHANGE_REQUIRED.md
#   by explicitly specifying every pipeline choice that materially affects the
#   per-sample anomaly score, allowing the Family-D v2 frozen contract to be
#   executed as Family-D v3 (same hypotheses, same operators, same inference rules;
#   only the upstream image→score pipeline is now frozen here).
#
# LOCK STATUS: FROZEN for Family-D v3 execution.
#   SHA256 of this file MUST be recorded in FAMILY_D_PARTITION_MANIFEST_v3.json
#   before any test-fold evaluation is run.
#
# LINEAGE:
#   - Family-D v2 hypotheses: docs/research/phase2/FAMILY_D_HYPOTHESES_v2.csv (unchanged)
#   - Family-D v2 protocol:   configs/phase2/family_d_v2_eyecandies_protocol.yaml (unchanged)
#   - Family-D v2 operators:  docs/research/phase2/FAMILY_D_V2_DEGRADATION_OPERATOR_SPEC.md (unchanged)
#   - Family-D v2 policy:     docs/research/phase2/FAMILY_D_SELECTION_AND_STATISTICAL_POLICY_v2.md (unchanged)
#   This file ADDS the upstream image scoring pipeline spec only.

scoring_pipeline:
  name: eyecandies_resnet50_patchcore_style_v3
  version: "3.0.0"
  dataset: Eyecandies
  dataset_release: "1.0.3"

  # ── A. Feature backbone ──────────────────────────────────────────────
  backbone:
    architecture: resnet50
    pretrained_weights: ImageNet1K_V2   # torchvision ResNet50_Weights.IMAGENET1K_V2
    weights_source: torchvision_hub
    frozen: true                        # no fine-tuning; inference only
    feature_layer: layer3               # output of ResNet-50 layer3 (before layer4/avgpool)
    feature_dim: 1024                   # spatial map, then adaptively pooled to 1024-D

  # ── B. Image pre-processing ──────────────────────────────────────────
  preprocessing:
    rgb:
      # Use the standard ImageNet normalisation shipped with ResNet50_Weights.IMAGENET1K_V2
      resize: 224
      center_crop: 224
      normalize_mean: [0.485, 0.456, 0.406]
      normalize_std:  [0.229, 0.224, 0.225]
      view_selection: image_0    # single canonical view (first of 6); others discarded
      justification: >
        image_0 is consistently the front-view canonical shot in the Eyecandies
        file convention. Using a single view is simpler, fully reproducible, and
        avoids multi-view aggregation bias. This choice is frozen; no ablation
        over view selection is performed.
    depth:
      # Depth is a single-channel 16-bit PNG; replicate to 3 channels for ResNet.
      replication: gray_to_rgb    # each channel = the same normalised depth value
      normalize_range: [0.0, 1.0] # normalise to [0,1] using per-image min/max
      resize: 224
      center_crop: 224
      # After gray→RGB replication, apply the same ImageNet norm for consistency
      normalize_mean: [0.485, 0.456, 0.406]
      normalize_std:  [0.229, 0.224, 0.225]
      justification: >
        Depth pre-processing via per-image min-max normalisation followed by
        ImageNet-norm replication is a standard practice when passing depth maps
        through ImageNet-pretrained CNNs (used in M3DM, BTF). Frozen here.

  # ── C. Pooling ───────────────────────────────────────────────────────
  pooling:
    type: adaptive_avg_pool_2d
    output_size: [1, 1]    # collapses spatial map to a single 1024-D vector
    justification: >
      Global average pooling of layer3 spatial features is the standard
      PatchCore/PADIM image-level summary. Patch-level memory banks are out of
      scope for the first v3 freeze (they require spatial label alignment which
      the Eyecandies protocol does not provide for validation-only calibration).

  # ── D. One-class anomaly scoring ─────────────────────────────────────
  scoring:
    method: cosine_distance_nearest_neighbour
    memory_bank: train_good_all    # all normal train features (no coreset subsampling)
    coreset_fraction: 1.0          # 100% — no subsampling; fully reproducible
    distance_metric: cosine        # distance = 1 − max_cosine_similarity
    justification: >
      Full memory bank (coreset_fraction=1.0) is chosen because Eyecandies train
      sets are ~1000 samples per category — small enough to store without
      subsampling. Coreset subsampling introduces randomness; freezing at 100%
      makes the memory bank fully deterministic given the backbone weights.
    normalisation:
      method: z_score_then_sigmoid
      reference_set: train_on_train  # leave-one-out approx: second-best similarity
      justification: >
        Train-set score distribution is used to z-normalise query scores.
        Sigmoid maps to [0,1] so that near-zero scores are in-distribution and
        near-1 scores are anomalous. This is symmetric with the operational
        usage in base_RGA.

  # ── E. Multi-category handling ───────────────────────────────────────
  categories:
    scope: per_category_independent  # memory bank fit per category; not shared
    categories:
      - CandyCane
      - ChocolateCookie
      - ChocolatePraline
      - Confetto
      - GummyBear
      - HazelnutTruffle
      - LicoriceSandwich
      - Lollipop
      - Marshmallow
      - PeppermintCandy

  # ── F. Embedding projection for RGA input ────────────────────────────
  embedding:
    method: pca_train
    output_dim: 16         # top-16 principal directions of train ResNet features
    fit_on: train_good_all # same set as memory bank
    per_category_and_modality: true  # independent PCA per (category, modality)
    justification: >
      PCA-16 is deterministic given the backbone and train images. 16 dimensions
      preserve most variance in ResNet-50 layer3 features (empirically >95%
      explained variance for natural image datasets at this scale) while keeping
      the fusion model input compact.

  # ── G. Output CSV schema ─────────────────────────────────────────────
  output:
    file: experiments/fusion/eyecandies_inputs.csv
    columns:
      - sample_id       # <category>__<split>__<sample_id>
      - fusion_split    # train | validation | test
      - category        # one of the 10 categories above
      - domain          # rgb | depth
      - label           # 0 for train/val (all normal); -1 placeholder for test
      - source_row      # integer index within the (category, split)
      - score           # sigmoid(z-score(cosine-distance)) in [0,1]
      - confidence      # 1.0 (no per-sample confidence available)
      - embedding_0..15 # PCA-16 projection of backbone feature

  # ── H. Label handling ────────────────────────────────────────────────
  labels:
    train: 0            # all train images are anomaly-free per Eyecandies spec
    validation: 0       # all val images are anomaly-free per Eyecandies spec
    test: deferred      # -1 placeholder; filled at the authorised final-metric step
    anomaly_mask_read: FORBIDDEN_BEFORE_FINAL_METRIC_STEP

  # ── I. Reproducibility invariants ────────────────────────────────────
  reproducibility:
    torch_seed_for_backbone: none_required  # weights are deterministic from torchvision hub
    numpy_rng_for_pca: none_required        # np.linalg.svd is deterministic
    no_random_state_in_pipeline: true
    required_packages:
      torch: ">=2.0"
      torchvision: ">=0.15"
      numpy: ">=1.24"
      Pillow: ">=9.0"
    implementation_file: src/scripts/family_d_v2_extract_features.py
    fusion_csv_file: src/scripts/family_d_v2_build_fusion_csv.py

  # ── J. Integrity guard ───────────────────────────────────────────────
  integrity:
    sha256_anchor_recorded_in: docs/research/phase2/FAMILY_D_PARTITION_MANIFEST_v3.json
    must_match_before_test_execution: true

# ── RGA experiment config (Eyecandies) ──────────────────────────────────
# This section configures the base_RGA pipeline that consumes the scoring CSV.
eyecandies_rga_config:
  data:
    path: experiments/fusion/eyecandies_inputs.csv
    format: csv
    id_column: sample_id
    domain_column: domain
    label_column: label
    score_column: score
    confidence_column: confidence
    category_column: category
    embedding_prefix: embedding_
    split_column: fusion_split
    domain_order: [rgb, depth]

  model:
    num_domains: 2
    embed_dim: 32
    num_heads: 4
    num_layers: 1
    dropout: 0.1
    use_attention: true
    use_confidence: true
    use_input_confidence: true
    use_domain_embeddings: true
    use_positional_embeddings: true
    use_missing_embedding: true

  training:
    seed: 42
    batch_size: 64
    epochs: 20
    lr: 0.001
    weight_decay: 0.01
    domain_dropout: 0.10
    split_column: fusion_split
    train_split_value: train
    val_split_value: validation
    test_split_value: test

  reliability:
    ece_weight: 0.45
    ks_weight: 0.35
    sharpness_weight: 0.20
    clean_gate_threshold: 0.66
    n_calibration_bins: 10
    min_samples_for_ks: 20
    category_aware: true
    unknown_category_policy: global

  # D-EYE operator config — mirrors frozen v2 operators
  degradation:
    D_EYE_1:
      target_domain: depth
      mode: zero_collapse
      seed_offset: 41000   # PRNG seed = global_seed + 41000
    D_EYE_2:
      target_domain: rgb
      mode: zero_collapse
      seed_offset: 41001
    D_EYE_3:
      target_domain: alternated
      mode: mask_collapse
      seed_offset: 41002
      mask_count: 1

  # Validation calibration protocol
  calibration:
    split: validation
    method: degradation_response_search
    clean_false_fire_budget: 0.010
    tau_candidates: [0.40, 0.45, 0.50, 0.55, 0.60, 0.66, 0.70, 0.75, 0.80]
    selection_criterion: max_degradation_auc_within_clean_budget
    locked_tau_g0: 0.66     # G0 gate uses locked tau; not tuned on validation

  # Inference spec — mirrors frozen v2 statistical policy
  inference:
    primary_cells: [D-EYE-1, D-EYE-2]
    secondary_cells: [D-EYE-3]
    primary_metric: roc_auc_delta_rga_minus_static
    seed_count_target: 30
    seed_count_minimum: 15
    seed_start: 42
    paired_bootstrap_iterations: 10000
    paired_bootstrap_seed: 0
    ci_alpha: 0.05
    multiplicity_correction: holm_bonferroni
    multiplicity_k: 2
    minimum_practical_delta: 0.010
