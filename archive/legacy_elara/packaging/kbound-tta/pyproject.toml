[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbound-tta"
version = "0.1.0"
description = "K-Bound / KGA: a label-free adapt/freeze/abstain certificate for test-time adaptation (Tent/EATA/SAR/SHOT candidates)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Pratik Niroula", email = "pratik.niroula.2059@gmail.com" }]
keywords = [
  "test-time adaptation", "distribution shift", "selective prediction",
  "identifiability", "tent", "eata", "sar", "shot", "knowability", "kga",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]
dependencies = [
  "torch>=1.13",
  "numpy>=1.21",
  "scipy>=1.7",
  "scikit-learn>=1.0",
]

[project.urls]
Homepage = "https://github.com/Pratikn03/AutoML_Flagship_V8"
Repository = "https://github.com/Pratikn03/AutoML_Flagship_V8"
Issues = "https://github.com/Pratikn03/AutoML_Flagship_V8/issues"

[tool.setuptools.packages.find]
where = ["src"]
