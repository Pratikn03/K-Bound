schema: elara_u_universal_protocol_v1
decision: D21_elara_u_universal_meta_router_program
date_locked: 2026-06-02
status_at_lock: PRE_REGISTERED_FRAMEWORK_pre_official_sweep
supersedes_for_scope: GATE_U_CROSS_DOMAIN_PROTOCOL_v1 (D20)  # D20 was the seed; D21 is the full contract

purpose: >
  Full pre-registered contract for the ELARA-U universal anomaly meta-router:
  select / fuse / abstain / fall-back across a detector zoo to reduce cross-domain
  regret, negative transfer, and calibration error. New program, new gate; does
  NOT reuse or relax strict clean Gate E (CLOSED_BY_PROOF_T9).

honest_claim_if_passed: >
  "Under measurable reliability separation and bounded validation error, ELARA-U
  reduces expected regret versus fixed detector selection across heterogeneous
  anomaly benchmarks; when the condition fails, the abstention/fallback rule
  limits negative transfer." NOT universal dominance, NOT best-on-every-dataset.

forbidden:   # any one kills the paper
  - claiming SOTA before real broad benchmark wins
  - test-label routing or post-hoc dataset/threshold selection
  - opened datasets as fresh official proof
  - comparing only against weak baselines
  - synthetic/proxy as primary evidence
  - reporting only best datasets; no ablation; no CIs; no code release; no failure analysis
  - banned phrases (C_NO_UNIVERSAL): "universal anomaly detection", "universal SOTA",
    "always robust", "works in all domains"

benchmark_target:
  families: [tabular, industrial_2d_vision, multimodal_3d, time_series, cyber_fraud, image_ood, text_log]
  task_count_target: 80-120
  leave_family_out: required   # some families never seen during router development
  acquired_now: [tabular(ADBench 47), cyber_fraud(UNSW,creditcard), behavior, multimodal_3d(source)]
  to_acquire: [TSB-AD/UCR/NAB/SMD(time_series), OpenOOD(image_ood), MVTec AD 2 + VisA(2d_vision)]

baselines_required:
  - fixed classical: [IForest, LOF, OCSVM, ECOD, COPOD, HBOS, KNN]
  - fixed deep per family: [PatchCore/PaDiM (vision), DeepSVDD/AE (tab/ts), OOD baselines]
  - ensembles: [mean, max, rank-mean, confidence-weighted mean, SAR]
  - learned stacking
  - validation-AUROC auto-selection   # the strong meta-baseline ELARA-U must beat
  - per-dataset oracle (upper bound only)
  - ELARA-U: {select, fuse, abstain}

method_required:
  score_archive: per-(task,detector) val/test scores + labels + provenance
  per_dataset_score_normalization: monotone z-sigmoid on train-OK
  reliability_features: [confidence, score entropy, spread/disagreement, validation
    calibration, drift-from-validation, missingness, detector-family id,
    sample uncertainty, dataset meta-features]
  router_actions: [select-one, fuse, abstain/defer, fallback-to-safe-baseline]
  negative_transfer_guard: low router confidence -> robust baseline
  calibration_layer: [isotonic / temperature / rank]
  training: validation/meta-train tasks only; never test labels or test selection

pass_contract:   # ALL required
  - mean rank improves over best fixed detector family (bootstrap CI lower bound > 0)
  - mean rank improves over the validation-selection meta-baseline (CI lower bound > 0)
  - negative_transfer_rate < baseline
  - worst_family_regret reduced vs baseline
  - calibration improves (ECE/Brier/NLL) with CI
  - leave_family_out evaluation passes
  - reliability-feature ablation HURTS (proves the method matters)
  - no test-label routing (audited)
  target_numbers:
    avg_rank_gain_ci_low: ">0"
    win_rate: ">=0.60"
    negative_transfer_rate: "<0.10"
    regret_reduction: ">=0.15"
    no_family_catastrophic_degradation: true

theory_required:   # supports the new claim (operationalizations acceptable, labelled)
  - regret bound vs best expert under finite validation data
  - negative-transfer guard theorem
  - calibration-error propagation
  - leave-family-out / meta-router generalization bound (O(sqrt(C/T)))
  - abstention theorem (when abstaining reduces expected loss)
  - limitation theorem (no universal dominance without assumptions)

canonical_pipeline:   # one-command reproducible
  - src/uais/elara_u/                         # method package
  - src/scripts/elara_u/build_score_archive.py
  - src/scripts/elara_u/train_router.py
  - src/scripts/elara_u/evaluate_universal_contract.py
  - src/scripts/elara_u/emit_tables.py
  - src/scripts/elara_u/emit_figures.py
  - experiments/elara_u/score_archive/  + results.json
  - docs/research/UNIVERSAL_ROUTER_PAPER_v1.tex

current_status_2026_06_02:
  done: [Gate U seed (49 tasks): router mean-rank gain -1.61 CI [-2.18,-1.02] significant;
         near-oracle regret 0.0035; worst-case rank NOT reduced (abstention needed)]
  next: [score-archive pipeline, abstention/fallback router, leave-family-out eval,
         calibration metrics, then acquire time-series + OOD + 2d-vision families]
