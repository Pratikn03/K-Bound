protocol: OFFICEHOME_PROTOCOL_M_v1
status: superseded_by_M_v2
created: 2026-06-18
purpose: >
  Follow-up clean held-out real-data win candidate discovered by the dev-side
  K-Bound win finder. Candidate/config was selected on OfficeHome target-val,
  then scored once on OfficeHome target-test with the separate holdout scorer.
integrity:
  selection_stage: dev_screen_only
  selection_records:
    - experiments/kbound/results/officehome_full_targetval/result_target_val_361a1e8c.json
  heldout_stage: target_test_transfer_score
  heldout_records:
    - experiments/kbound/results/officehome_full_targettest/result_target_test_6605675d.json
  alpha: 0.10
  rule: adapt if lower confidence bound on benefit is positive; freeze if upper bound is negative; otherwise abstain
  note: >
    Do not sweep target-test and claim the best target-test row. The recorded
    target-test result is valid only for the dev-selected config below.
selected_config:
  dataset: OfficeHome
  candidate: sar_online_aggressive
  estimator: gbr
  conformal: global
  calibration_split: target_val
  evaluation_split: target_test
