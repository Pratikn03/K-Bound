conservative_reading_applied: true

finding: >
  The reported Protocol-G beats-both (regret_kga 3.616898e-05, regret_adapt 1.320168e-03,
  regret_freeze 7.49240e-02, false_adapt 0.025641, n_test 54) is a DOMAIN-POOLING ARTIFACT.
  analyze_F.py splits records BY RANDOM SEED (dev {0,1} / test {2,3,4}) and never filters by
  WILDS domain. For eata_online the n=54 "held-out test" set is 18 OOD test + 18 OOD val +
  18 in-distribution id_val cells. The only domain where adapting ever hurts is id_val
  (76.7% of cells harmful, |B|<0.06). On genuine OOD (test, or test+val) eata is
  helpful-dominated (0% harmful), so regret_kga == regret_adapt == 0 and KGA only TIES
  always-adapt -> no beats-both. The win exists only because id_val is pooled in.

