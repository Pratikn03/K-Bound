attempt_ledger:
  - attempt_id: development_attempt_01_mps_float64_transfer
    requested_device: mps
    scope: development_only
    failure_category: mps_device_and_float64_conversion_order
    failure_stage: >-
      Frozen BatchNorm probe-state construction in the first development cell,
      before a successful probe forward or trace seal.
    observed_error: >-
      TypeError: Cannot convert a MPS Tensor to float64 because MPS does not
      support float64 tensors.
    archived_output: >-
      /Volumes/T9/uav/AutoML_Flagship_V8/experiments/kbound/results/
      cct20_prospective_v1/superseded/
      development_gate_v1.failed_mps_float64_20260828
    residue: empty_trace_directory_and_filesystem_metadata_only
    successful_development_traces: 0
    target_runner_invoked: false
    target_outcomes_accessed: false

  - attempt_id: development_attempt_02_mps_root_batchnorm_backward
    requested_device: mps
    scope: development_only
    failure_category: sealed_runtime_mps_root_batchnorm_backward_nonfinite
    failure_stage: >-
      First official Tent probe stream. The ResNet-50 root BatchNorm affine
      parameters and their Adam moments became NaN after the first update;
      no development trace was sealed.
    diagnostic_boundary: >-
      The defect reproduced for synthetic and development-only batches from 2
      through 127 images. A two-image CPU official-Tent control stayed finite.
      These were runtime diagnostics, not gate or target outcome analyses.
    archived_output: >-
      /Volumes/T9/uav/AutoML_Flagship_V8/experiments/kbound/results/
      cct20_prospective_v1/superseded/
      development_gate_v1.failed_mps_bn_backward_20260828
    residue: empty_trace_directory_and_filesystem_metadata_only
    successful_development_traces: 0
    target_runner_invoked: false
    target_outcomes_accessed: false

  - attempt_id: development_attempt_03_cpu_provenance_interruption
    requested_device: cpu
    scope: development_only
    interruption_stage: first_development_cell_before_any_artifact_commit
    interruption_reason: >-
      An independent audit found that development traces did not yet bind their
      generating runtime and code identities. The process was deliberately
      interrupted before evidence was persisted.
    archived_output: >-
      /Volumes/T9/uav/AutoML_Flagship_V8/experiments/kbound/results/
      cct20_prospective_v1/superseded/
      development_gate_v1.interrupted_pre_runtime_provenance_20260828
    residue: empty_trace_directory_and_filesystem_metadata_only
    successful_development_traces: 0
    target_runner_invoked: false
    target_outcomes_accessed: false

explicit_protocol_amendments:
  downstream_batching:
    original_target_images_per_batch: 128
    amended_sequence_atomic_max_images: 32
    sequence_atomicity_unchanged: true
    cross_location_batches_forbidden: true
    singleton_final_batch_merge_unchanged: true
    oversized_single_sequence_rule_unchanged: >-
      A sequence longer than 32 images remains one indivisible oversize batch.
    selection_basis: >-
      Runtime-only synthetic preflight on the locked 16-GB host. A 32-image
      official-Tent update with the reviewed fallback took about 0.77 seconds;
      127 images took about 20.59 seconds. No development benefit, gate result,
      target prediction, or target outcome was used to choose 32.
    tuning_claim: no_outcome_based_batch_tuning

  execution_backend:
    strategy: mps_resnet50_official_tent_cpu_root_bn1_v1
    requested_device_argument: mps
    automatic_device_selection: forbidden
    frozen_model_device: mps
    adapted_model_default_device: mps
    fallback_layer: bn1
    fallback_module_class: KBoundCPUFallbackBatchNorm2d
    fallback_input_device: mps
    fallback_compute_device: cpu
    fallback_parameter_device: cpu
    fallback_output_device: mps
    official_tent_parameter_devices_expected: [cpu, mps]
    installation_state_rule: >-
      The native and installed root-BatchNorm state dictionaries must have the
      same exact tensor SHA-256 before official Tent configuration.
    frozen_upstream_required: true
    reason: sealed_runtime_mps_root_batchnorm_backward_nonfinite

official_tent_contract_unchanged:
  upstream_entry_points: [configure_model, collect_params, Tent]
  optimizer: Adam
  learning_rate: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.0
  steps: 1
  episodic: false
  reset_boundary: checkpoint_x_location
  collected_parameter_set: every_BatchNorm2d_weight_and_bias
  prediction_semantics: official_pre_update_logits_for_each_online_batch

implementation_corrections:
  amendment_fail_closed_replay:
    parser: PyYAML_6.0.3_safe_load
    checksum_sidecar_required: true
    exact_repository_path_required: true
    schema_and_status_replayed: true
    immutable_anchor_hashes_replayed: true
