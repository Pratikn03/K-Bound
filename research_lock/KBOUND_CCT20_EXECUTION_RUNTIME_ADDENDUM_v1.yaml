    exact_code_file_hashes_replayed: true
    canonical_code_aggregate_replayed: true
    batch_backend_thread_scope_and_dependency_counts_replayed: true
    validation_points:
      - before_pre_development_shared_runtime_identity_creation
      - before_target_execution_seal_creation
      - before_locked_target_execution
    explicit_device_argument_rule: only_literal_mps_is_accepted
    automatic_device_resolution_rejected: true

  device_first_cpu_float64_transfer:
    locked_sequence:
      - detach_for_diagnostic_or_serialized_values
      - transfer_to_cpu_without_dtype_change
      - widen_to_float64_on_cpu
    applies_to:
      - frozen_batchnorm_running_moments
      - probe_batchnorm_sufficient_statistics
      - official_tent_update_norm
      - frozen_and_adapted_serialized_logits
    mathematical_feature_definitions_changed: false

  batchnorm_probe_sufficient_statistics:
    originating_device_reduction_dtype: float32
    reduction_operation: torch.var_mean
    reduction_dimensions: [batch, height, width]
    population_variance_correction: 0
    transfer_scope: O(number_of_batchnorm_channels)
    merge_device: cpu
    merge_dtype: float64
    batch_m2_rule: transfer_variance_then_multiply_by_exact_count_in_cpu_float64
    numerical_identity_claimed_across_backends: false
    disclosure: >-
      The dtype and operation contract is fixed, but ordinary backend-specific
      float32 rounding differences are possible. No cross-backend bitwise or
      numerical identity is claimed.

