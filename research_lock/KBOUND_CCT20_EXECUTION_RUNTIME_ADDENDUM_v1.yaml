change_control:
  immutable_after_shared_runtime_receipt_creation: true
  amendment_rule: >-
    Any later device, batch, thread, software, deterministic-setting, numeric
    implementation, code, data, checkpoint, gate, scoring, or inference change
    requires a new versioned addendum and disclosure. If any successful
    development trace exists, all 55 development cells must be regenerated.
    No target-setting change is permitted after target outcomes are opened.

publication_disclosure:
  required_summary: >-
    Two MPS attempts failed before any development trace was sealed: one exposed
    an MPS-to-float64 transfer-order defect and one exposed non-finite root
    BatchNorm gradients under the sealed MPS runtime. A CPU attempt was then
    deliberately interrupted before its first trace so runtime provenance could
    be bound prospectively. The versioned downstream amendment capped
    sequence-atomic batches at 32 and used CPU only for the adapted ResNet root
    BatchNorm inside an otherwise MPS model. Exact official Tent code,
    parameters, optimizer settings, reset boundaries, and pre-update prediction
    semantics were retained. BatchNorm diagnostic moments were reduced in
    float32 and merged in CPU float64. No cross-backend numerical identity is
    claimed.
  prohibited_claims:
    - downstream_batch_32_was_fixed_in_the_original_protocol
    - hybrid_backend_was_fixed_in_the_original_protocol
    - no_development_annotations_were_loaded_during_failed_attempts
    - literal_label_unopened_target_selection
    - bitwise_identity_across_cpu_cuda_and_mps
    - hardware_independent_results
    - failed_attempts_produced_successful_scientific_evidence
