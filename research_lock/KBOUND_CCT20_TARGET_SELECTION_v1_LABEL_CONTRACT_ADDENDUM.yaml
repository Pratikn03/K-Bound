status: SEALED_LABEL_CONTRACT_BEFORE_TARGET_INFERENCE

reason: >-
  A source-only schema audit found that the archive categories and annotation
  multiplicity are more complicated than the public-summary shorthand recorded
  in the target-selection lock. This addendum corrects the factual description
  and freezes a deterministic label contract before any target prediction,
  decision, accuracy, benefit, regret, or K-Bound outcome is computed.

source_only_findings:
  target_annotation_values_inspected_for_this_addendum: false
  official_train_images: 13553
  official_train_annotations: 14071
  train_images_with_repeated_annotations: 414
  train_images_with_more_than_one_distinct_category: 7
  category_description_correction: >-
    The 16 archive categories are 14 animal categories, car, and empty; they are
    not 15 animal categories plus empty.

frozen_category_mapping:
  order: ascending_sparse_archive_category_id
  category_id_to_output_index:
    1: 0
    3: 1
    5: 2
    6: 3
    7: 4
    8: 5
    9: 6
    10: 7
    11: 8
