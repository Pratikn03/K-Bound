    9: coyote
    10: rabbit
    11: bird
    16: cat
    21: badger
    30: empty
    33: car
    34: deer
    51: fox
    99: rodent

frozen_multi_annotation_rule:
  repeated_same_category: collapse to one ground-truth category
  distinct_categories: retain the complete set of distinct ground-truth categories
  training_target: >-
    Uniform probability mass over the distinct ground-truth category set; use
    normalized soft-target cross-entropy. A single-category image is the usual
    one-hot special case.
  primary_top1_correctness: >-
    One if the model's single top-ranked category is a member of the complete
    ground-truth category set, and zero otherwise.
  primary_benefit: >-
    Adapted set-membership top-1 correctness minus frozen set-membership top-1
    correctness, aggregated using the locked camera-by-checkpoint estimand.
  secondary_macro_f1: >-
    Multi-label macro-F1 over all 16 category indicators, with the model's top-1
    prediction represented as a one-hot prediction set.
  zero_annotation_image: fail the complete experiment; never exclude or substitute
  unknown_category_id: fail the complete experiment

unchanged_population_contract:
  - all official trans-test images remain mandatory
  - all nine official trans-test camera locations remain mandatory
  - no image is excluded because it is empty, a car, repeated, or multi-category
  - the label-free target runner receives no category IDs or ground-truth sets
  - the separate scorer joins the sealed predictions to the complete label sets only after action-artifact hashing
  - all results are reported regardless of direction or statistical significance

interpretation_boundary:
  valid: prospective all-frame 16-output natural-shift evaluation with set-valued top-1 scoring
  invalid:
    - exact reproduction of the paper's single-label classification leaderboard
    - 15-animal-plus-empty task description
    - selecting the first annotation or first category by file order
    - removing conflicting target images after labels are joined
