schema: sealed_external_protocol_v1
decision: D24_sealed_external_holdout
date_locked: 2026-06-02
status_at_lock: FROZEN_BEFORE_HOLDOUT_SCORED

purpose: >
  Elevate the stacking result from development evidence to SEALED evidence
  (Gate U point 7). The method, baselines, detector zoo, and pass condition are
  frozen here, BEFORE the holdout is scored; the holdout is run exactly once with
  no post-hoc tuning or method/threshold selection.

frozen_method:   # identical to the development pipeline; no changes for the holdout
  detector_zoo: [ECOD, COPOD, IForest, LOF, KNN, OCSVM]   # gate_u_seed_eval.detector_zoo
  per_dataset_norm: z-sigmoid on train scores; StandardScaler on features
  split: stratified 50/25/25 train/val/test, seed 0
  main_method: rank-normalized logistic stacking on validation scores (no test labels)
  baselines: [auto_select (val-AUROC argmax), best_fixed_detector, rank_mean, simple_average]
  metric: per-task test AUROC; paired bootstrap (10000) over tasks
  code: src/scripts/elara_u/sealed_external_eval.py (runs the frozen pipeline)

sealed_holdout:   # UNTOUCHED during all development (different feature extractors)
  source: ADBench
  tasks:
    - CV_by_ViT (image-OOD under ViT features)        # dev used CV_by_ResNet18
    - NLP_by_RoBERTa (text under RoBERTa features)     # dev used NLP_by_BERT
  rationale: >
    Same ADBench task suite but a DIFFERENT representation than development; these
    feature sets were never loaded, scored, or inspected while building the
    123-task archive or tuning anything. Honest scope: this is a sealed held-out
    under shifted representation, not a wholly independent data source.

primary_endpoint:
  field: gate_sealed_external_confirmed
  pass_condition:
    - stack vs auto_select: paired-AUROC mean > 0 AND 95% CI lower bound > 0
    - stack vs best_fixed_detector: mean > 0 AND CI lower bound > 0
  run_policy: ONE_SHOT (no re-run, no tuning, no task/threshold selection after scoring)

integrity:
  method_frozen_before_holdout: true
  used_test_labels_for_selection: false
  one_shot: true
  forbidden:
    - tuning the stacker/zoo/threshold after seeing the holdout result
    - dropping holdout tasks post-hoc
    - re-running with a different method if the first result is unfavourable
  honest_note: >
    If stack does NOT beat auto-select on this sealed holdout, that is the sealed
    result and it is reported as-is (the development finding would then be flagged
    as not replicating under representation shift).
