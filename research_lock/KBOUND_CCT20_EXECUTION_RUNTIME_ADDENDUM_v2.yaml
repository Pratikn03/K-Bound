  v1_trace_reuse: forbidden

publication_disclosure:
  required_summary: >-
    After 15 authorized development cells had been sealed, the next cell
    halted before trace creation because direct floating-point evaluation of a
    theoretically nonnegative Gaussian KL produced -5.55e-17 through
    cancellation. Before gate fitting or any target inference, runtime
    addendum v2 replaced only this computation with an algebraically equivalent
    stable log1p/Taylor evaluation with no clipping, and required all 55
    development cells to be regenerated. The partial v1 traces were preserved
    for provenance and excluded from every final analysis. The target remained
    outcome-unopened.
  prohibited_claims:
    - all_downstream_code_was_fixed_before_any_development_outcome
    - v1_partial_traces_contributed_to_the_final_gate
    - gaussian_kl_values_were_clipped_or_floored
    - literal_label_unopened_target_selection
    - bitwise_identity_across_cpu_cuda_and_mps
    - hardware_independent_results
    - failed_or_superseded_attempts_produced_final_scientific_evidence
