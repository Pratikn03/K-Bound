purpose: >-
  Versioned downstream execution amendment for the final K-Bound CCT-20
  confirmation. Development attempt v1 stopped fail-closed after 15 immutable
  traces when the next cell exposed cancellation in a mathematically
  nonnegative Gaussian-KL diagnostic. This amendment preserves and excludes
  the partial v1 evidence, replaces only that diagnostic's numerical
  evaluation with an algebraically equivalent stable implementation, and
  requires all 55 development cells to be regenerated before gate fitting or
  target inference.

