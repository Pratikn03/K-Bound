implementation_corrections:
  stable_gaussian_kl:
    numeric_implementation: stable_relative_variance_log1p_taylor_v2
    mathematical_definition: gaussian_kl_probe_to_source
    source_scale: source_var+eps
    relative_variance: "(probe_var-source_var)/(source_var+eps)"
    variance_gap: "x-log1p(x)"
    mean_gap: "(probe_mean-source_mean)^2/(source_var+eps)"
    taylor_threshold: 0.0001
    taylor_terms: 6
    taylor_series: "x^2/2-x^3/3+x^4/4-x^5/5+x^6/6-x^7/7"
    numeric_clipping: none
    nonfinite_or_negative_result: fail_closed
    feature_definition_changed: false
    official_tent_update_changed: false
    outcome_based_tuning: false
    regenerate_all_55_development_cells: true
    exact_failure_regression_expected: 1.3540155737375239e-17

  amendment_fail_closed_replay:
    parser: PyYAML_6.0.3_safe_load
    checksum_sidecar_required: true
    exact_repository_path_required: true
    schema_and_status_replayed: true
    immutable_anchor_hashes_replayed: true
    superseded_v1_record_receipt_and_archive_hashes_replayed: true
    exact_code_path_set_replayed: true
