    canonical_code_aggregate_replayed: true
    batch_backend_numeric_thread_scope_and_dependency_counts_replayed: true
    validation_points:
      - before_pre_development_shared_runtime_identity_creation
      - before_target_execution_seal_creation
      - before_locked_target_execution
    explicit_device_argument_rule: only_literal_mps_is_accepted
    automatic_device_resolution_rejected: true

  device_first_cpu_float64_transfer:
    locked_sequence:
      - detach_for_diagnostic_or_serialized_values
      - transfer_to_cpu_without_dtype_change
      - widen_to_float64_on_cpu
    mathematical_feature_definitions_changed: false

  batchnorm_probe_sufficient_statistics:
