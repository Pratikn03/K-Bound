  prospective_boundary: >-
    Sealed after 15 authorized development traces and two development-only
    numerical diagnostics, but before a development gate or collection
    existed, before any target action or target model inference, and before
    target outcomes were opened.
  conflict_rule: >-
    The original protocol controls every field not explicitly amended by v1
    or v2. Addendum v1 controls the batch cap and hybrid backend. Addendum v2
    supersedes only the Gaussian-KL numerical evaluation and requires a fresh
    55-cell development run. Any other conflict must stop execution.

