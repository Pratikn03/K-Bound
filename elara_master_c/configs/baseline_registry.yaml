# Non-ELARA and ELARA comparators (frozen before final test)

version: 1
status: development  # Phase 5 strongest-baseline freeze NOT complete (D5 open)

static_attention_v1:
  role: primary_reference
  config: configs/attention_real_fusion.yaml
  embed_dim: 48
  num_heads: 4
  num_layers: 1
  epochs: 25
  domain_dropout: 0.15
  seeds: [42, 43, 44, 45, 46]

classical_baselines:
  - confidence_weighted_mean
  - logistic_stacking
  - random_forest
  - histogram_gradient_boosting
  - early_fusion_mlp
  - late_fusion_ensemble

tta_baselines:
  - tent
  - ttt_pseudo_label
  - sar  # where protocol valid

elara_components:
  base_rga: G0_mean_gate
  rga_plus: validation_selected_head
  monitor: gate_decision_rule + certificate

strongest_frozen_comparator:
  status: NOT_SELECTED
  rule: validation-only selection per research_lock/protocol_registry_v1.yaml pending_protocols.strong_baseline_confirmation
