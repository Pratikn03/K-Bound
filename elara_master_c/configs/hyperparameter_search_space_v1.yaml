# Validation-only hyperparameter grids for Master Scenario C development.
# NEVER use test labels for selection. Log every trial to audits/hyperparameter_trials.csv

version: 1
selection_metric:
  fusion_attention: val_pr_auc
  rga_plus: roc_pr_f1
  gate: clean_false_fire_rate_subject_to_degraded_gain

attention_fusion:
  embed_dim: [32, 48, 64]
  num_heads: [2, 4, 8]
  num_layers: [1, 2]
  domain_dropout: [0.0, 0.10, 0.15, 0.25]
  lr: [0.0005, 0.001, 0.002]
  weight_decay: [0.005, 0.01, 0.02]
  early_stopping_metric: [pr_auc]
  restore_best_weights: true

reliability_gate:
  clean_gate_threshold: [0.4, 0.5, 0.6, 0.66, 0.7, 0.8]
  ece_weight: [0.45]
  ks_weight: [0.35]
  sharpness_weight: [0.20]
  gate_mode: [mean]

rga_plus_candidates:
  families: [hgb, logistic]
  note: Full grid defined in reliability_boosted_fusion.py (11 candidates); select on validation only.

seed_policy:
  debug: [42]
  development: [42, 43, 44, 45, 46]
  confirmatory_minimum: 10
  confirmatory_preferred: 20

legacy_reproduction:
  early_stopping_metric: val_loss
  restore_best_weights: false
  note: Match pre-2026-05 training loop only when reproducing locked JSON artifacts.
