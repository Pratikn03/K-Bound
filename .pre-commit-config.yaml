# Pre-commit hooks for the K-Bound / KGA anomaly-intelligence repo.
#
#   pip install pre-commit
#   pre-commit install            # enable the git hook
#   pre-commit run --all-files    # run every hook over the whole tree
#
# Ruff is the single source of truth for linting and formatting (line-length 120,
# rule set E,W,F,I,C,B,UP), configured in pyproject.toml under [tool.ruff]; the
# hooks below inherit that configuration. mypy is run only over the pure-numpy
# `kga/` package, which is fully typed.
#
# Pinned revisions are recent stable tags; bump them with `pre-commit autoupdate`.

minimum_pre_commit_version: "3.5.0"

repos:
  # --- Ruff: lint (with autofix) + format -------------------------------------
  # Pinned to the 0.6.x family, which matches the ruff config in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format
        name: ruff (format)

  # --- Standard hygiene hooks -------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: debug-statements

  # --- Static typing for the kga/ package only --------------------------------
  # The rest of the repo carries optional/heavy deps and is not yet fully typed;
  # `kga/` is pure numpy/scipy and type-clean, so we gate it here.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (kga only)
        files: ^kga/
        args: ["--ignore-missing-imports"]
        additional_dependencies: ["numpy"]
