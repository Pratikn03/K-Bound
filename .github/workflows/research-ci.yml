name: research-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install the maintained package
        run: python -m pip install -e ".[test]"
      - name: Reject syntax and import failures
        run: python -m compileall -q kga docs/research/kbound/kbound_pkg/kbound
      - name: Run certificate and routing tests
        run: python -m pytest tests -q

  research-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install camera and audit dependencies
        run: python -m pip install -e ".[research,test]"
      - name: Reject raw-runner syntax and import failures
        run: python -m compileall -q experiments/kbound/training
      - name: Run paper, dashboard, and camera integrity tests
        run: >-
          python -m pytest
          tests/test_multiseed_training.py
          docs/research/kbound/kbound_pkg/tests
          docs/research/kbound/edge/tests
          docs/research/kbound/dashboard/tests
          -q
      - name: Rebuild the canonical dashboard snapshot
        run: python docs/research/kbound/scripts/build_dashboard_snapshot.py
      - name: Require a clean generated snapshot
        run: git diff --exit-code -- docs/research/kbound/dashboard/data/snapshot.json

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs/research/kbound/dashboard/package-lock.json
      - name: Compile the research dashboard
        working-directory: docs/research/kbound/dashboard
        run: npm ci && npm run build
      - name: Require the dashboard entry page
        run: test -f docs/research/kbound/kbound_dashboard.html
      - name: Require committed JavaScript to match TypeScript
        run: git diff --exit-code -- docs/research/kbound/dashboard/js

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the paper toolchain
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          latexmk texlive-latex-base texlive-latex-extra
          texlive-fonts-recommended texlive-publishers texlive-science
      - name: Compile the authoritative manuscript
        working-directory: docs/research/kbound
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error kbound_short.tex
      - name: Reject unresolved references or citations
        working-directory: docs/research/kbound
        run: >-
          ! grep -E
          'undefined references|Citation .* undefined|Reference .* undefined|There were undefined'
          kbound_short.log
