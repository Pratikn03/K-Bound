name: Research Dashboard

on:
  push:
    branches: ["main", "master"]
    paths:
      - "elara_master_c/audits/**"
      - "research_lock/FLAGSHIP_DEV_PROTOCOL_v1.yaml"
      - "research_dashboard/**"
      - ".github/workflows/research_dashboard.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "elara_master_c/audits/**"
      - "research_lock/FLAGSHIP_DEV_PROTOCOL_v1.yaml"
      - "research_dashboard/**"
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build C++ aggregator (optional)
        run: |
          cd research_dashboard
          if [[ -f build.sh ]]; then
            chmod +x build.sh
            ./build.sh
          else
            echo "build.sh not present — using committed snapshot artifacts"
          fi

      - name: Generate snapshot (with history)
        run: |
          if [[ -x research_dashboard/build/elara_research_snapshot ]]; then
            ./research_dashboard/build/elara_research_snapshot \
              --repo-root "${{ github.workspace }}"
          else
            echo "snapshot binary not present — validating committed snapshot.json only"
          fi

      - name: Verify snapshot JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("research_dashboard/web/data")
          p = root / "snapshot.json"
          if not p.is_file():
              history = sorted(root.glob("history/snapshot_*.json"))
              if not history:
                  raise SystemExit("no snapshot.json and no history snapshots found")
              p = history[-1]
              print("using history snapshot:", p.name)
          data = json.loads(p.read_text())
          assert "checklist" in data and "gates" in data
          assert "history_timeline" in data
          assert "diff_vs_previous" in data
          print("snapshot OK:", data.get("generated_at"))
          PY

      - name: Upload dashboard artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-dashboard
          path: |
            research_dashboard/web/data/snapshot.json
            research_dashboard/web/data/history/
          if-no-files-found: warn
