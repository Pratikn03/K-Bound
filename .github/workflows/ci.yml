name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Lint (syntax/undefined-name gate)
        run: |
          ruff check --select E9,F63,F7,F82 .

  tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "${{ github.workspace }}/src"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt
          python -m pip install pandas==3.0.3 pytest==9.0.3 pytest-cov==7.1.0 httpx2==2.2.0 matplotlib==3.10.9 pyarrow==24.0.0 pypdf==6.11.0 tifffile==2026.3.3
          python -m pip install torch==2.12.0 torchvision==0.27.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests with coverage
        run: |
          pytest tests --cov=src/uais --cov-report=xml --cov-report=term --cov-report=html -v
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      - name: Archive coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/
      - name: Check coverage threshold
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          coverage = float(root.attrib['line-rate']) * 100
          print(f"Coverage: {coverage:.2f}%")
          if coverage < 50:
              print(f"WARNING: Coverage {coverage:.2f}% is below 50% threshold")
          else:
              print(f"✓ Coverage {coverage:.2f}% meets threshold")
          PY
      - name: Smoke fusion flow
        run: |
          python scripts/ci_smoke.py
      - name: Smoke orchestration stubs (best-effort)
        run: |
          python - <<'PY'
          import os
          os.environ["PYTHONPATH"] = f"{os.getcwd()}/src"
          from orchestration.fraud_flow import fraud_pipeline
          from orchestration.cyber_flow import cyber_pipeline
          from orchestration.behavior_flow import behavior_pipeline
          from orchestration.fusion_flow import fusion_pipeline

          def safe_run(name, fn):
              try:
                  print(f"[ci] running {name}")
                  fn()
                  print(f"[ci] {name} succeeded")
              except Exception as exc:
                  # Do not fail CI on these best-effort smokes
                  print(f"[ci] {name} skipped/failed: {exc}")

          safe_run("fraud_pipeline", fraud_pipeline)
          safe_run("cyber_pipeline", cyber_pipeline)
          safe_run("behavior_pipeline", behavior_pipeline)
          safe_run("fusion_pipeline", fusion_pipeline)
          print("[ci] orchestration stubs best-effort smoke completed")
          PY

  deploy-security:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "${{ github.workspace }}/src"
      UAIS_API_KEYS: ci-secret
      UAIS_CORS_ORIGINS: https://ci.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API and security deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-api.txt
          python -m pip install bandit[toml] pytest httpx2==2.2.0
      - name: API security regression tests
        run: |
          pytest -q tests/test_api_production_security.py
      - name: Deploy Bandit scan
        run: |
          bandit -r deploy -x '*/._*,*/.__*'
      - name: Compose config validates with required production env
        run: |
          docker compose config >/tmp/uais-compose-config.yml
      - name: Docker production API smoke
        run: |
          docker build -t uais-api-ci .
          docker run --rm -d --name uais-api-ci \
            -p 127.0.0.1:8000:8000 \
            -e UAIS_API_KEYS=ci-secret \
            -e UAIS_CORS_ORIGINS=https://ci.example \
            -e UAIS_PRODUCTION_MODE=true \
            uais-api-ci
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          def request(path, api_key=None):
              headers = {}
              if api_key:
                  headers["X-API-Key"] = api_key
              req = urllib.request.Request(f"http://127.0.0.1:8000{path}", headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=5) as resp:
                      return resp.status, resp.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          try:
              for _ in range(30):
                  status, _ = request("/health")
                  if status == 200:
                      break
                  time.sleep(1)
              else:
                  raise AssertionError("/health did not become ready")

              assert request("/ready")[0] == 403
              ready_status, ready_body = request("/ready", "ci-secret")
              assert ready_status == 503
              assert json.loads(ready_body)["checks"]["models"]["status"] == "fail"
          finally:
              import subprocess

              subprocess.run(["docker", "rm", "-f", "uais-api-ci"], check=False)
          PY
      - name: API imports with production env
        run: |
          python - <<'PY'
          from deploy.api.main import app, CORS_ORIGINS
          assert app.title == "UAIS-V Enhanced API"
          assert CORS_ORIGINS == ["https://ci.example"]
          PY
