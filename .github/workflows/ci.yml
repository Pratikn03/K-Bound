name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Lint (syntax/undefined-name gate)
        run: |
          ruff check --select E9,F63,F7,F82 .

  kbound-core:
    name: KGA core (hermetic smoke + theorem validators)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/src"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core deps (numpy/scipy + lint/type)
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy ruff mypy
      - name: Ruff + mypy on the typed kga core
        run: |
          ruff check kga
          mypy kga --ignore-missing-imports
      - name: Certificate single-source drift guard
        run: |
          python -m pip install pytest
          pytest tests/test_certificate_drift_guard.py -q
      - name: Hermetic KGA trichotomy smoke (no data, no torch)
        run: bash scripts/smoke_kbound.sh
      - name: Per-theorem validators
        run: |
          shopt -s nullglob
          for v in experiments/kbound/theory_validation/val_*.py; do
            echo "== $v =="
            python "$v" || exit 1
          done
