name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Explicitly lint maintained first-party trees.  Vendor, archive, and immutable
# evidence trees are intentionally outside this path list; non-mutating
# pre-commit structural and secret-scanning hooks still cover them.
env:
  FIRST_PARTY_PATHS: >-
    kga
    deploy/api
    scripts
    src
    tests
    experiments/kbound
    docs/research/kbound

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: First-party critical-error gate
        run: |
          ruff check --select E9,F63,F7,F82 ${{ env.FIRST_PARTY_PATHS }}

  kbound-core:
    name: KGA core (hermetic smoke + theorem validators)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: "${{ github.workspace }}:${{ github.workspace }}/src"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - name: Install core package and test/lint deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest scikit-learn ruff mypy
      - name: Ruff + mypy on the typed kga core
        run: |
          ruff check kga
          mypy kga --ignore-missing-imports
      - name: Certificate single-source drift guard
        run: |
          pytest tests/test_certificate_drift_guard.py -q
      - name: Hermetic KGA trichotomy smoke (no data, no torch)
        run: bash scripts/smoke_kbound.sh
      - name: Per-theorem validators
        run: |
          shopt -s nullglob
          for v in experiments/kbound/theory_validation/val_*.py; do
            echo "== $v =="
            python "$v" || exit 1
          done
