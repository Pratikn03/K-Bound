# =============================================================================
# K-Bound / KGA continuous integration (fast, hermetic, no GPU, no external data)
#
# Complements the core syntax/KGA checks in .github/workflows/ci.yml. This
# workflow contains the wider K-Bound matrix, including the hash-locked Linux
# CPU research suite:
#   * lint      — broad critical-error gate over explicit first-party paths +
#                 strict ruff lint/format on the maintained A+ surfaces.
#   * kga-package      — import + version + the pure-numpy/scipy package tests.
#   * unit-tests       — the new package test suite with coverage.
#   * hermetic-smoke   — scripts/smoke_kbound.sh: zero external data, < 60s.
#   * theorem-validators — every val_thm*.py must exit 0.
#
# kga is a top-level package -> repo root on PYTHONPATH.
# =============================================================================

name: kbound-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: kbound-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The broad gate checks runtime-critical rules throughout maintained first-party
# trees.  Full lint and formatting remain limited to the explicit A+ allowlist;
# this does not claim that historical research scripts are style-clean.
env:
  FIRST_PARTY_PATHS: >-
    kga
    deploy/api
    scripts
    src
    tests
    experiments/kbound
    docs/research/kbound
  APLUS_PATHS: >-
    kga
    src/scripts/kbound/make_synth_archive.py
    src/scripts/kbound/smoke_trichotomy.py
    deploy/api/kga_routes.py
    kga/experiment_contract.py
    docs/research/kbound/scripts/validate_closure_protocol.py
    docs/research/kbound/scripts/run_closure_stage.py
    tests/test_kga_package.py
    tests/test_kga_experiment_contract.py
    tests/test_smoke_trichotomy.py

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff
      - name: Critical-error gate (first-party paths)
        run: ruff check --select E9,F63,F7,F82 ${{ env.FIRST_PARTY_PATHS }}
      - name: Full ruff lint (A+ surfaces)
        run: ruff check ${{ env.APLUS_PATHS }}
      - name: Ruff format check (A+ surfaces)
        run: ruff format --check ${{ env.APLUS_PATHS }}

  kga-package:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install minimal kga deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pyyaml pytest build twine
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          smoke_dir="$(mktemp -d)"
          (cd "$smoke_dir" && env -u PYTHONPATH python -c "import kga; print(kga.__version__)")
          (cd "$smoke_dir" && env -u PYTHONPATH kga --help >/dev/null)
      - name: Import kga and print version
        run: python -c "import kga; print(kga.__version__)"
      - name: kga unit tests
        run: pytest tests/test_kga_package.py -q

  unit-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install production API profile and test deps
        run: |
          python -m pip --version
          python -m pip install --only-binary=:all: --require-hashes \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-ci-py312-linux.lock.txt
      - name: Run unit tests with coverage
        run: |
          pytest \
            tests/test_kga_package.py \
            tests/test_kga_experiment_contract.py \
            tests/test_kga_routing.py \
            tests/test_smoke_trichotomy.py \
            tests/test_kga_api_routes.py \
            tests/test_kga_masked_inputs.py \
            tests/test_kga_unavailable_runtime.py \
            tests/test_kga_unavailable_api.py \
            tests/test_model_governance.py \
            --cov=kga \
            --cov-report=term-missing --cov-report=xml
      - name: Upload coverage.xml
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  hermetic-smoke:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install smoke deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Run hermetic K-Bound smoke
        run: bash scripts/smoke_kbound.sh

  theorem-validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install validator deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy
      - name: Run every theorem validator
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(experiments/kbound/theory_validation/val_thm*.py)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No theorem validators found" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done
      - name: Run theory_v2 Wave 4 validators
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd docs/research/kbound/theory_v2
          scripts=(val_tight_constants.py val_multiclass_multicandidate.py val_anytime_multicandidate.py val_multiclass_capacity.py val_margin_computability.py val_regression_bracketing_closure.py val_minimax_optimality.py)
          for script in "${scripts[@]}"; do
            echo "::group::theory_v2/$script"
            if [[ "$script" == val_minimax_optimality.py ]]; then
              python "$script"
            else
              python "$script" --fast
            fi
            echo "::endgroup::"
          done

  lean-formal:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install elan (Lean toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Download pinned Mathlib build cache
        working-directory: docs/research/kbound/formal
        run: lake exe cache get
      - name: Build KBound Lean package
        run: |
          cd docs/research/kbound/formal
          bash build.sh
      - name: Scoped kernel and transitive-axiom audit
        run: |
          cd docs/research/kbound/formal
          python3 formal_audit.py --build --strict-core

  kbound-research-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: >-
        ${{ github.workspace }}:${{ github.workspace }}/src:${{ github.workspace }}/docs/research/kbound/kbound_pkg:${{ github.workspace }}/docs/research/kbound/edge/src
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - name: Install research-test deps
        run: |
          python -m pip --version
          python -m pip install --only-binary=:all: --require-hashes \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r requirements-ci-py312-linux.lock.txt
      - name: Verify CPU-only Torch contract
        run: |
          python - <<'PY'
          import torch
          import torchvision

          assert torch.__version__ == "2.5.1+cpu", torch.__version__
          assert torchvision.__version__ == "0.20.1+cpu", torchvision.__version__
          assert torch.version.cuda is None, torch.version.cuda
          assert not torch.cuda.is_available()
          print("CPU Torch contract OK", torch.__version__, torchvision.__version__)
          PY
      - name: K-Bound research tests (pkg + integrity + edge)
        run: |
          pytest \
            docs/research/kbound/kbound_pkg/tests \
            docs/research/kbound/tests \
            docs/research/kbound/edge/tests \
            -q --tb=short
      - name: Repository collection gate
        run: pytest --collect-only -q
      - name: Safe CI lock and README authority regressions (executed)
        run: |
          pytest \
            tests/test_ci_cpu_index_contract.py \
            tests/test_readme_quickstart_authority.py \
            -q --tb=short
      - name: Synthetic SAR and AETTA regressions (executed)
        run: |
          pytest \
            tests/test_aetta_estimate_pair_validation.py \
            tests/test_aetta_mc_image_cap_regression.py \
            tests/test_sar_reliable_rollback_regression.py \
            tests/test_ci_method_regression_selectors.py \
            -q --tb=short
      - name: Safe release provenance and CI scope regressions (executed)
        run: |
          pytest \
            tests/test_release_provenance_integration.py \
            tests/test_ci_release_scope.py \
            -q --tb=short
      - name: Portable manuscript numbers and publication guards (executed)
        run: |
          pytest \
            tests/test_kbound_empirical_macros.py \
            tests/test_kbound_current_pdf_publication.py \
            tests/test_kbound_pdf_build_isolation.py \
            tests/test_kbound_release_identity.py \
            tests/test_kbound_manuscript_reconciliation.py \
            tests/test_kbound_narrative_revision.py \
            tests/test_word_export.py \
            tests/test_word_portability.py \
            tests/test_build_docx_pipeline.py \
            tests/test_project_proof_receipts.py \
            tests/test_kbound_publication_package.py \
            -q --tb=short
      - name: Portable historical dependency regressions (executed)
        run: |
          pytest \
            tests/test_historical_diagnostic_recovery.py \
            tests/test_project_historical_diagnostic_receipt.py \
            tests/test_domainnet_pilot_data_v2.py \
            tests/test_project_domainnet_stop.py \
            tests/test_ci_portable_dependency_selectors.py \
            -q --tb=short
      - name: Synthetic operator and build-tool regressions (executed)
        run: |
          pytest \
            tests/test_operator_wrapper_guards.py \
            tests/test_repository_bandit_compatibility.py \
            tests/test_release_bandit_contract.py \
            tests/test_release_build_dependencies.py \
            tests/test_ci_operator_regression_selectors.py \
            -q --tb=short -W error
      - name: Safe launcher and output-isolation regressions (executed)
        run: |
          pytest \
            tests/test_camelyon_results_root_isolation.py \
            tests/test_cifar_imagenetc_grid_contract.py \
            tests/test_cifar_percell_output_isolation.py \
            tests/test_kbtrain_dispatch_safety.py \
            tests/test_final_showcase_dispatch.py \
            tests/test_rxrx1_9plus_launcher.py \
            tests/test_ci_launcher_regression_selectors.py \
            -q --tb=short
      - name: Current runtime and manuscript regressions (executed)
        run: |
          pytest \
            tests/test_kga_package.py \
            tests/test_kga_benefit_estimator.py \
            tests/test_kga_routing.py \
            tests/test_kga_masked_inputs.py \
            tests/test_certificate_drift_guard.py \
            tests/test_kga_unavailable_runtime.py \
            tests/test_kga_api_routes.py \
            tests/test_kga_unavailable_api.py \
            tests/test_kbound_theory_scope.py \
            tests/test_kbound_formal_audit.py \
            tests/test_kbound_current_policy_bindings.py \
            tests/test_kbound_bibliography.py \
            tests/test_kbound_estimand_inference_wording.py \
            tests/test_kbound_dashboard_metadata.py \
            tests/test_reconcile_no_implicit_cleanup.py \
            -q --tb=short
      - name: Prospective experiment-contract tests
        # Automatic CI has no protected-study authorization. Real protected
        # artifact readers remain available through the separately authorized
        # local repository-verification profile; no such tests are deleted.
        run: |
          pytest \
            tests/test_kga_experiment_contract.py \
            tests/test_kga_frontier_api.py \
            tests/test_pacs_replay_artifact.py \
            tests/test_independent_checkpoint_audit.py \
            tests/test_official_baseline_provenance.py \
            tests/test_natural_target_provenance.py \
            tests/test_exact_confirmation_pipeline.py \
            tests/test_release_source_seal.py \
            tests/test_release_checksum_verifier.py \
            tests/test_so2sat_prospective_protocol.py \
            tests/test_so2sat_target_boundary.py \
            -q
      - name: Draft closure-protocol validation
        # Broad natural-target provenance generation belongs to the separately
        # authorized study workflow, not this default source/contract check.
        run: |
          python docs/research/kbound/scripts/validate_closure_protocol.py
          python docs/research/kbound/scripts/run_frontier_kga_bridge.py
          python docs/research/kbound/scripts/audit_official_baselines.py --repo .
      - name: Certificate drift guard
        run: pytest tests/test_certificate_drift_guard.py -q
      - name: Canonical script wrappers resolve
        run: |
          python -c "
          from src.scripts.kbound._canonical import canonical_script
          for name in ('cifar_tent_mps_v2.py', 'cifar_tent_online.py'):
              p = canonical_script(name)
              assert p.is_file(), p
              print('OK', name)
          "
