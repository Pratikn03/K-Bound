# edge_calibration_v1 -- benefit-estimator + split-conformal calibration protocol.
# Consumed by scripts 04/05/06 on top of edge_label_inspection_v1.yaml.
calibration: edge_calibration_v1

alpha: 0.10            # must match the inspection protocol
fit_fraction: 0.60     # fraction of calibration conditions used to FIT the estimator;
                       # the remaining (1 - fit_fraction) is the CONFORMAL split
conservative: true     # finite-sample order-statistic radius (vs population quantile)
split_seed: 0

# HistGradientBoostingRegressor hyper-parameters
estimator:
  max_iter: 150
  learning_rate: 0.05
  max_depth: 3
  l2_regularization: 1.0
  min_samples_leaf: 8
  random_state: 0

# thresholds for the simple comparison policies in the ablation table
policies:
  conf_tau: 0.50
  entropy_tau: 0.05
