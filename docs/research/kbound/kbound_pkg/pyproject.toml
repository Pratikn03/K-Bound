[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbound"
version = "0.1.0"
description = "K-Bound certificate: conformal + anytime-valid adaptation gate for test-time adaptation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
torch = ["torch"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kbound*"]
