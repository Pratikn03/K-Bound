[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbound"
version = "0.1.0"
description = "K-Bound certificate: conformal + anytime-valid adaptation gate for test-time adaptation"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Pratik Niroula"}]
dependencies = [
    "numpy>=1.23",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
torch = ["torch"]

[project.urls]
Homepage = "https://github.com/Pratikn03/K-Bound"
Repository = "https://github.com/Pratikn03/K-Bound"
Issues = "https://github.com/Pratikn03/K-Bound/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kbound*"]
