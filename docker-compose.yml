services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./experiments/kbound:/app/experiments/kbound:ro
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Prefer KGA_*. Legacy UAIS_* still works because deploy/api reads both.
      KGA_API_KEYS: ${KGA_API_KEYS:?Set KGA_API_KEYS before starting the API}
      KGA_CORS_ORIGINS: ${KGA_CORS_ORIGINS:?Set KGA_CORS_ORIGINS before starting the API}
      KGA_PRODUCTION_MODE: ${KGA_PRODUCTION_MODE:-false}
      KGA_REQUIRED_MODELS: ${KGA_REQUIRED_MODELS:-}
      KGA_TRUSTED_MODEL_ARTIFACTS: ${KGA_TRUSTED_MODEL_ARTIFACTS:-false}
      KGA_REQUIRE_MODEL_CHECKSUMS: ${KGA_REQUIRE_MODEL_CHECKSUMS:-false}
      # Multi-replica rate limiting: KGA_REDIS_URL=redis://redis:6379/0
      KGA_REDIS_URL: ${KGA_REDIS_URL:-}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles:
      - distributed
    ports:
      - "127.0.0.1:6379:6379"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /data
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  streamlit:
    profiles:
      - legacy
    image: python:3.11-slim-bookworm@sha256:8dca233de9f3d9bb410665f00a4da6dd06f331083137e0e98ccf227236fcc438
    working_dir: /app
    volumes:
      - ./archive/legacy_elara:/app/legacy:ro
    command: bash -c "echo 'ELARA Streamlit dashboard archived under archive/legacy_elara/dashboard'; exit 1"

  mlflow:
    profiles:
      - research
    image: ghcr.io/mlflow/mlflow:v2.14.0@sha256:7a1deb607de52710ea860911998ce2693ec50eb1a31dfc6754f5f58a17044e44
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlruns
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlruns:/mlruns
      - ./mlflow.db:/mlflow.db
    security_opt:
      - no-new-privileges:true

networks:
  default:
    driver: bridge
